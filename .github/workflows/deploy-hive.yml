name: Deploy Hive

on:
  push:
    branches: [ main ]
    paths: [ 'hive/**' ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_APP: bev-hive-fn
  RESOURCE_GROUP: bev-platform-rg
  PROJECT: 'hive/BEV Hive.csproj'
  PUBLISH_DIR: hive/publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read build label
        id: label
        run: echo "value=$(cat hive/BUILD_LABEL.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build + publish
        run: dotnet publish "${{ env.PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Stamp build label
        run: |
          az functionapp config appsettings set \
            --name ${{ env.FUNCTION_APP }} -g ${{ env.RESOURCE_GROUP }} \
            --settings "HIVE_BUILD_LABEL=${{ steps.label.outputs.value }}"
